version: '3.9'

services:
  postgres:
    image: postgres:16.1-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmarketingos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      target: build
    command: npm run dev
    ports:
      - '4000:4000'
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

  worker-audit:
    build:
      context: .
      target: build
    command: npm run worker:audit
    env_file: .env
    depends_on:
      - postgres
      - redis


  # Book-to-film + manuscript extraction (book-video, book-manuscript queues)
  worker-book-video:
    build:
      context: .
      target: build
    command: npm run worker:book-video
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker-ai:
    build:
      context: .
      target: build
    command: npm run worker:ai
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker-email:
    build:
      context: .
      target: build
    command: npm run worker:email
    env_file: .env
    depends_on:
      - redis

  worker-analytics:
    build:
      context: .
      target: build
    command: npm run worker:analytics
    env_file: .env
    depends_on:
      - postgres
      - redis

  cron:
    build:
      context: .
      target: build
    command: npm run cron
    env_file: .env
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
